name: Lint, Test & Sync README

on:
  push:
    paths:
      - 'config.toml'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - 'config.toml'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: write

jobs:
  lint-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uvx ruff@0.16.7 check .

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -t . -v

      - name: Validate Config
        run: uv run python -c "from src.core.config import load_toml, parse_config, parse_app_entries, CONFIG_PATH; data = load_toml(CONFIG_PATH); parse_app_entries(data, parse_config(data))"

      - name: Sync README with config.toml
        if: github.event_name == 'push'
        run: uv run python -m src.scripts.readme update

      - name: Commit README if changed
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md obtainium.json
          git diff --cached --quiet || git commit -m "docs: auto-sync README with config.toml [skip ci]"
          git push