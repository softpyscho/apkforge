name: CI
on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build all apps (skip update check)'
        required: false
        type: boolean
        default: false
      apps:
        description: 'Specific apps to build (comma-separated, e.g. "WhatsApp,Reddit")'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  check-versions:
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.get-matrix.outputs.build_matrix }}
      has_updates: ${{ steps.get-matrix.outputs.has_updates }}
      apps_to_build: ${{ steps.get-matrix.outputs.apps_to_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check for updates
        id: get-matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
          APPS_INPUT: ${{ inputs.apps }}
        run: |
          RESULT="$(uv run python -m src.scripts.matrix get-matrix)"
          echo "build_matrix=$(echo "$RESULT" | jq -c '.include')" >> "$GITHUB_OUTPUT"
          COUNT=$(echo "$RESULT" | jq '.include | length')
          if [ "$COUNT" -gt 0 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            APPS_LIST=$(echo "$RESULT" | jq -r '[.include[].id] | unique | join(",")')
            echo "apps_to_build=$APPS_LIST" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "apps_to_build=" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify skipped build
        if: steps.get-matrix.outputs.has_updates != 'true'
        run: echo "::notice title=Build Skipped::No new releases or updates detected."

      - name: Clear older runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list -L400 --repo "$GITHUB_REPOSITORY" --json databaseId -q '.[].databaseId' | tail -n+91 | xargs -IID gh api "repos/$GITHUB_REPOSITORY/actions/runs/ID" -X DELETE || true

  build:
    name: build
    needs: check-versions
    if: needs.check-versions.outputs.has_updates == 'true'
    uses: ./.github/workflows/build.yml
    with:
      apps: ${{ needs.check-versions.outputs.apps_to_build }}
      force_build: ${{ inputs.force_build == true }}
    secrets: inherit