name: Build APKs
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      filter_changelog:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.set-matrix.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare version and draft release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(date +%y.%m.%d)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VER" --draft --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VER" --draft --title "$VER" --notes "" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Set matrix based on release group
        id: set-matrix
        env:
          FILTER_CHANGELOG: ${{ inputs.filter_changelog }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT="$(uv run python -m src.scripts.matrix get-build-matrix)"
          echo "matrix=$(echo "$RESULT" | jq -c '{include}')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$RESULT" | jq -r '.prerelease')" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Restore stock APKs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: unmodified-apks/
          key: apk-cache-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: |
            apk-cache-${{ matrix.id }}-

      # A solver that cannot start must not fail the build: without it the run simply
      # degrades to the unsolved behaviour, which is what happens when the variable is
      # unset anyway. FLARESOLVERR_URL is only exported once the container answers.
      - name: Start FlareSolverr (optional)
        id: flaresolverr
        if: vars.USE_FLARESOLVERR == 'true'
        run: |
          docker rm -f flaresolverr 2>/dev/null || true
          if ! docker run -d --rm --name flaresolverr -p 8191:8191 ghcr.io/flaresolverr/flaresolverr:latest; then
            echo "::warning title=FlareSolverr::Container failed to start; continuing without a challenge solver"
            exit 0
          fi
          for i in {1..30}; do
            if curl -fsS http://localhost:8191/ >/dev/null 2>&1; then
              echo "url=http://localhost:8191" >> "$GITHUB_OUTPUT"
              echo "FlareSolverr is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::warning title=FlareSolverr::Did not become ready within 60s; continuing without a challenge solver"

      - name: Build APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          APKFORGE_PROXY: ${{ secrets.APKFORGE_PROXY }}
          FLARESOLVERR_URL: ${{ steps.flaresolverr.outputs.url }}
        run: uv run main.py ${{ matrix.id }} ${{ matrix.arch }}

      - name: Stop FlareSolverr
        if: always() && vars.USE_FLARESOLVERR == 'true'
        run: docker rm -f flaresolverr 2>/dev/null || true

      - name: Save stock APKs
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: unmodified-apks/
          key: apk-cache-${{ matrix.id }}-${{ hashFiles('unmodified-apks/*') }}

      - name: Cleanup old caches
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install actions/gh-actions-cache
          echo "Fetching list of cache keys"
          cacheKeysForPR=$(gh actions-cache list -R $GITHUB_REPOSITORY --key apk-cache-${{ matrix.id }}- -L 100 | cut -f 1 )
          set +e
          for cacheKey in $cacheKeysForPR
          do
              if [ "$cacheKey" != "apk-cache-${{ matrix.id }}-${{ hashFiles('unmodified-apks/*') }}" ]; then
                  gh actions-cache delete $cacheKey -R $GITHUB_REPOSITORY --confirm
              fi
          done

      - name: Upload APKs to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          apks=(./build/*.apk ./build/*.apkm)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No APKs to upload, skipping"
            exit 0
          fi
          for i in {1..5}; do
            gh release upload "$TAG" "${apks[@]}" --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 5
          done
          exit 1

      - name: Upload build log to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        run: |
          [[ -f build.md ]] || exit 0
          [[ -s build.md ]] || exit 0
          cp build.md "build-${LABEL}.md"
          for i in {1..5}; do
            gh release upload "$TAG" "build-${LABEL}.md" --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 5
          done
          exit 1

      - name: Upload patches info to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        run: |
          [[ -f patches_info.json ]] || exit 0
          cp patches_info.json "patches_info-${LABEL}.json"
          for i in {1..5}; do
            gh release upload "$TAG" "patches_info-${LABEL}.json" --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 5
          done
          exit 1

      - name: Upload versions info to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        run: |
          [[ -f build.json ]] || exit 0
          cp build.json "versions_info-${LABEL}.json"
          for i in {1..5}; do
            gh release upload "$TAG" "versions_info-${LABEL}.json" --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 5
          done
          exit 1

  release:
    needs: [prepare, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Commit config version bumps
        if: always()
        run: |
          uv run python -m src.scripts.wa_version || echo "wa_version fetch failed, skipping config commit"
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add config.toml
          git diff --cached --quiet || git commit -m "config: track recommended WhatsApp versions [skip ci]"
          git push || true

      - name: Check if any APKs were uploaded
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          has=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".apk") or endswith(".apkm"))] | length > 0')
          echo "has_apks=${has}" >> "$GITHUB_OUTPUT"

      - name: Download logs and patches from draft release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p logs patches versions
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "build-*.md" --dir logs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "patches_info-*.json" --dir patches || true
          uv run python -c "import json, glob, pathlib; merged = {}; [merged.update(json.loads(pathlib.Path(f).read_text())) for f in glob.glob('patches/*.json')]; pathlib.Path('patches_info.json').write_text(json.dumps(merged, indent=2))"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "versions_info-*.json" --dir versions || true
          uv run python -c "import json, glob, pathlib; merged = {'success': [], 'excluded_patches': {}}; [ (merged['success'].extend(d.get('success', [])), merged['excluded_patches'].update(d.get('excluded_patches', {}))) for d in (json.loads(pathlib.Path(f).read_text()) for f in glob.glob('versions/*.json')) ]; pathlib.Path('versions_info.json').write_text(json.dumps(merged, indent=2))"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | startswith("build-") or startswith("patches_info-") or startswith("versions_info-")) | .apiUrl' | xargs -I{} gh api --method DELETE "{}"

      - name: Combine logs and finalize release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          # Intentionally NOT passed to `gh release edit`. GitHub resolves
          # /releases/latest to the newest non-prerelease release, and two things
          # depend on it: src/scripts/matrix.py::_fetch_our_releases() (the daily
          # update check would see no release and rebuild everything), and the
          # Obtainium config of every app in obtainium.json / the README, which
          # tracks .../releases/latest (marking releases as pre-releases would break
          # update tracking on every user's device). Wiring this up therefore needs
          # both of those changed first; see CHANGELOG.md -> Known limitations.
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          uv run python -m src.scripts.logs combine-logs logs | sed "s/{TAG}/$TAG/g" > final.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --title "$TAG" --notes-file final.md

      - name: Send Telegram notification
        if: steps.check.outputs.has_apks == 'true' && env.TG_TOKEN != '' && env.TG_CHAT != ''
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: uv run python -m src.scripts.telegram notify

      - name: Delete empty draft if no APKs
        if: steps.check.outputs.has_apks != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true

      - name: Update patches info and README
        if: steps.check.outputs.has_apks == 'true'
        run: |
          uv run python -m src.scripts.readme update
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add patches_info.json versions_info.json obtainium.json README.md
          git diff --cached --quiet || git commit -m "docs: update patches and versions info [skip ci]"
          git push || true
