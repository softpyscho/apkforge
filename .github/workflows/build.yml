name: Build APKs
on:
  workflow_dispatch:
    inputs:
      patch_source:
        description: 'Select patch source (release-group) or "all"'
        required: true
        default: 'all'
        type: string
  workflow_call:
    inputs:
      patch_source:
        default: 'all'
        type: string
      filter_changelog:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.set-matrix.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Prepare version and draft release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$(date +%y.%m.%d)-${{ inputs.patch_source }}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          if gh release view "$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VER" --draft --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$VER" --draft --title "$VER" --notes "" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Set matrix based on release group
        id: set-matrix
        env:
          FILTER_CHANGELOG: ${{ inputs.filter_changelog }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT="$(uv run python -m src.scripts.matrix get-matrix '${{ inputs.patch_source }}')"
          echo "matrix=$(echo "$RESULT" | jq -c '{include}')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$RESULT" | jq -r '.prerelease')" >> "$GITHUB_OUTPUT"

  run:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95  # v5.6.0
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache stock APKs
        uses: actions/cache@v4
        with:
          path: unmodified-apks/
          key: apk-cache-${{ matrix.id }}-${{ hashFiles('config.toml') }}
          restore-keys: |
            apk-cache-${{ matrix.id }}-

      - name: Cleanup old caches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install actions/gh-actions-cache
          echo "Fetching list of cache keys"
          cacheKeysForPR=$(gh actions-cache list -R $GITHUB_REPOSITORY --key apk-cache-${{ matrix.id }}- -L 100 | cut -f 1 )
          set +e
          for cacheKey in $cacheKeysForPR
          do
              if [ "$cacheKey" != "apk-cache-${{ matrix.id }}-${{ hashFiles('config.toml') }}" ]; then
                  gh actions-cache delete $cacheKey -R $GITHUB_REPOSITORY --confirm
              fi
          done

      - name: Build APKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: uv run main.py ${{ matrix.id }} ${{ matrix.arch }}

      - name: Upload APKs to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          shopt -s nullglob
          apks=(./build/*.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No APKs to upload, skipping"
            exit 0
          fi
          for i in {1..5}; do
            gh release upload "$TAG" "${apks[@]}" --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 5
          done
          exit 1

      - name: Upload build log to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        run: |
          [[ -f build.md ]] || exit 0
          [[ -s build.md ]] || exit 0
          cp build.md "build-${LABEL}.md"
          for i in {1..5}; do
            gh release upload "$TAG" "build-${LABEL}.md" --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 5
          done
          exit 1

      - name: Upload patches info to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        run: |
          [[ -f patches_info.json ]] || exit 0
          cp patches_info.json "patches_info-${LABEL}.json"
          for i in {1..5}; do
            gh release upload "$TAG" "patches_info-${LABEL}.json" --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 5
          done
          exit 1

      - name: Upload versions info to draft release
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          LABEL: ${{ matrix.id }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
        run: |
          [[ -f build.json ]] || exit 0
          cp build.json "versions_info-${LABEL}.json"
          for i in {1..5}; do
            gh release upload "$TAG" "versions_info-${LABEL}.json" --clobber --repo "$GITHUB_REPOSITORY" && exit 0
            sleep 5
          done
          exit 1

  release:
    needs: [prepare, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          python-version: "3.13"
          enable-cache: true
          quiet: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check if any APKs were uploaded
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          has=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith(".apk"))] | length > 0')
          echo "has_apks=${has}" >> "$GITHUB_OUTPUT"

      - name: Download logs and patches from draft release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p logs patches versions
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "build-*.md" --dir logs
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "patches_info-*.json" --dir patches || true
          uv run python -c "import json, glob, pathlib; merged = json.loads(pathlib.Path('patches_info.json').read_text()) if pathlib.Path('patches_info.json').exists() else {}; [merged.update(json.loads(pathlib.Path(f).read_text())) for f in glob.glob('patches/*.json')]; pathlib.Path('patches_info.json').write_text(json.dumps(merged, indent=2))"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "versions_info-*.json" --dir versions || true
          uv run python -c "import json, glob, pathlib; merged = json.loads(pathlib.Path('versions_info.json').read_text()) if pathlib.Path('versions_info.json').exists() else {'success':[]}; [merged['success'].extend(json.loads(pathlib.Path(f).read_text()).get('success', [])) for f in glob.glob('versions/*.json')]; pathlib.Path('versions_info.json').write_text(json.dumps(merged, indent=2))"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name | startswith("build-") or startswith("patches_info-") or startswith("versions_info-")) | .apiUrl' | xargs -I{} gh api --method DELETE "{}"

      - name: Combine logs and finalize release
        if: steps.check.outputs.has_apks == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          uv run python -m src.scripts.logs combine-logs logs | sed "s/{TAG}/$TAG/g" > final.md
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --title "$TAG" --notes-file final.md
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --title "$TAG" --notes-file final.md
          fi

      - name: Send Telegram notification
        if: steps.check.outputs.has_apks == 'true' && env.TG_TOKEN != '' && env.TG_CHAT != ''
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: uv run python -m src.scripts.telegram notify '${{ inputs.patch_source }}'

      - name: Delete empty draft if no APKs
        if: steps.check.outputs.has_apks != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes || true

      - name: Update patches info and README
        if: steps.check.outputs.has_apks == 'true'
        run: |
          uv run python -m src.scripts.readme update
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add patches_info.json versions_info.json README.md
          git diff --cached --quiet || git commit -m "docs: update patches and versions info [skip ci]"
          git push || true
