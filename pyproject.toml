[project]
name = "apkforge"
version = "0.0.0"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "softpyscho" }
]
license = { file = "LICENSE" }
urls = { Repository = "https://github.com/softpyscho/apkforge" }
dependencies = [
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.2",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "RUF", "SIM", "C4", "PTH", "G", "PIE"]
ignore = ["E501"]